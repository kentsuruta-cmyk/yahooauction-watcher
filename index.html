<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KENJAGAMES // Auction Watcher</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f5f5f5; color: #111; font-family: 'Courier New', monospace; }
header { padding: 20px 40px; border-bottom: 1px solid #ddd; background: #fff; }
header h1 { color: #e0003c; font-size: 20px; letter-spacing: 2px; }
header p { color: #888; font-size: 12px; margin-top: 4px; }
.container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
.card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 30px; margin-bottom: 20px; }
.card h2 { color: #e0003c; font-size: 13px; letter-spacing: 3px; margin-bottom: 20px; }
.search-btn { width: 100%; background: #e0003c; border: none; color: #fff; padding: 14px; border-radius: 4px; font-size: 14px; letter-spacing: 2px; cursor: pointer; font-family: 'Courier New', monospace; transition: background 0.2s; }
.search-btn:hover { background: #c0002e; }
.search-btn:disabled { background: #ccc; cursor: not-allowed; }
.results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.results-header span { color: #888; font-size: 12px; }
.filter-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.filter-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.filter-btn { background: #f5f5f5; border: 1px solid #ddd; color: #555; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: 'Courier New', monospace; transition: all 0.2s; }
.filter-btn.active { background: #e0003c; border-color: #e0003c; color: #fff; font-weight: bold; }
.action-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.clear-btn { background: none; border: 1px solid #ddd; color: #888; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-family: 'Courier New', monospace; white-space: nowrap; }
.clear-btn:hover { border-color: #e0003c; color: #e0003c; }
.hide-btn { background: none; border: 1px solid #ddd; color: #888; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-family: 'Courier New', monospace; white-space: nowrap; transition: all 0.2s; }
.hide-btn.active { background: #111; border-color: #111; color: #fff; }
.hide-btn:hover { border-color: #111; color: #111; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { color: #e0003c; text-align: left; padding: 10px 12px; border-bottom: 2px solid #e0e0e0; font-size: 11px; letter-spacing: 1px; }
td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; color: #333; vertical-align: top; }
tr:hover td { background: #fafafa; }
tr.checked td { opacity: 0.4; }
td a { color: #e0003c; text-decoration: none; }
td a:hover { text-decoration: underline; }
.badge { font-size: 10px; padding: 2px 8px; border-radius: 3px; font-weight: bold; display: inline-block; white-space: nowrap; margin-bottom: 2px; }
.badge-used { background: #00aa55; color: #fff; }
.badge-junk { background: #e0003c; color: #fff; }
.tax-badge { font-size: 9px; padding: 1px 5px; border-radius: 3px; display: inline-block; margin-left: 4px; }
.tax-in { background: #ddd; color: #555; }
.tax-ex { background: #fff3cd; color: #856404; }
.check-btn { background: none; border: 1px solid #ccc; border-radius: 3px; width: 24px; height: 24px; cursor: pointer; font-size: 13px; line-height: 22px; text-align: center; display: inline-block; transition: all 0.2s; }
.check-btn.on { background: #00aa55; border-color: #00aa55; color: #fff; }
.status { text-align: center; padding: 40px; color: #888; font-size: 13px; }
.progress { color: #e0003c; font-size: 12px; text-align: center; padding: 20px; }
.note { color: #aaa; font-size: 11px; margin-bottom: 12px; }
.tabs { display: flex; background: #fff; border-bottom: 1px solid #ddd; padding: 0 40px; }
.tab { background: none; border: none; border-bottom: 3px solid transparent; padding: 14px 26px; font-family: 'Courier New', monospace; font-size: 13px; letter-spacing: 2px; color: #888; cursor: pointer; transition: all 0.2s; }
.tab:hover { color: #e0003c; }
.tab.active { color: #e0003c; border-bottom-color: #e0003c; font-weight: bold; }
.cond { color: #999; font-size: 10px; margin-top: 3px; }
.badge-auction { background: #0066cc; color: #fff; }
.badge-fixed { background: #555; color: #fff; }
.watch-btn { background: none; border: 1px solid #ccc; color: #888; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; font-family: 'Courier New', monospace; white-space: nowrap; transition: all 0.2s; }
.watch-btn:hover { border-color: #0066cc; color: #0066cc; }
.watch-btn.on { background: #0066cc; border-color: #0066cc; color: #fff; }
.watch-count { color: #0066cc; font-size: 11px; }
</style>
</head>
<body>
<header>
<h1>KENJAGAMES // Auction Watcher</h1>
<p id="headerNote">ヤフオク新着ゲーム機モニタリングツール</p>
</header>
<div class="tabs">
<button class="tab active" id="tab-yahoo" onclick="switchTab('yahoo')">ヤフオク</button>
<button class="tab" id="tab-mercari" onclick="switchTab('mercari')">メルカリ</button>
</div>
<div class="container">
<div class="card">
<h2>▸ MONITOR CONFIG</h2>
<p style="color:#888; font-size:12px; margin-bottom:8px;">
監視対象：DMG / GBC / GBP / GBA / GBA SP / DS / DS Lite / DSi / DSi LL / 3DS / 3DS LL / PSP 1000・2000・3000
</p>
<p id="configNote" style="color:#aaa; font-size:11px; margin-bottom:16px;"></p>
<button class="search-btn" id="searchBtn" onclick="startSearch()">🔍 ヤフオクの新着を検索する</button>
</div>
<div class="card" id="resultsCard" style="display:none;">
<div class="results-header">
<h2>▸ RESULTS</h2>
<span id="resultCount"></span>
</div>
<div class="filter-row">
<div class="filter-btns" id="filterBtns"></div>
<div class="action-btns">
<span id="watchCount"></span>
<button class="hide-btn" id="hideCheckedBtn" onclick="toggleHideChecked()">チェック済みを隠す</button>
<button class="clear-btn" onclick="clearChecked()">チェックをリセット</button>
</div>
</div>
<p class="note" id="resultNote">※価格はヤフオク表示価格です。</p>
<p class="note" id="refreshNote"></p>
<div id="progressLog"></div>
<div id="resultsBody"></div>
</div>
</div>
<script>
let allItems = [];
let currentFilter = 'all';
let hideChecked = false;
let checkedIds = new Set();
// メルカリのオークション監視リスト（商品ID → { maxPrice, ... }）
var watchMap = {};
// いまテーブルに描画している行（監視ボタンから商品情報を引くために保持する）
var renderedItems = [];

// タブごとの違いはここに集約。テーブル描画などの処理は両タブで共通のものを使う。
var SOURCES = {
  yahoo: {
    label: 'ヤフオク',
    endpoint: '/api/search',
    hideCheckedDefault: false,
    headerNote: 'ヤフオク新着ゲーム機モニタリングツール',
    configNote: '',
    resultNote: '※価格はヤフオク表示価格です。',
    timeHeader: '残り時間',
    loading: 'ヤフオクから新着を取得中...',
    idOf: function (link) {
      var m = link.match(/\/auction\/([a-z0-9]+)/i);
      return m ? m[1] : link;
    },
  },
  mercari: {
    label: 'メルカリ',
    endpoint: '/api/mercari',
    // チェック済みはヤフオクと同じくグレイアウト表示のまま残す。
    // 売れ残りを消したいときは「チェック済みを隠す」で切り替えられる
    hideCheckedDefault: false,
    headerNote: 'メルカリ新着ゲーム機モニタリングツール',
    configNote: '※メルカリは「送料込み」の出品のみ、各機種の「本体」カテゴリに限定して抽出します。',
    resultNote: '※送料込みの出品のみを対象にしているため、表示価格がそのまま総額です。',
    timeHeader: '出品',
    loading: 'メルカリから新着を取得中...',
    idOf: function (link) {
      var m = link.match(/\/(?:item|shops\/product)\/([A-Za-z0-9]+)/);
      return m ? m[1] : link;
    },
  },
};

// 「チェック済みを隠す」の状態はタブごとに保持する（初期値は SOURCES の hideCheckedDefault）
var hideCheckedBySource = {
  yahoo: SOURCES.yahoo.hideCheckedDefault,
  mercari: SOURCES.mercari.hideCheckedDefault,
};

var currentSource = 'yahoo';
// 取得済みの結果はタブごとに保持し、タブを戻したときに再検索しなくて済むようにする
var resultCache = { yahoo: null, mercari: null };

function source() { return SOURCES[currentSource]; }

async function switchTab(name) {
  if (name === currentSource) return;
  currentSource = name;

  document.getElementById('tab-yahoo').classList.toggle('active', name === 'yahoo');
  document.getElementById('tab-mercari').classList.toggle('active', name === 'mercari');
  document.getElementById('headerNote').textContent = source().headerNote;
  document.getElementById('configNote').textContent = source().configNote;
  document.getElementById('resultNote').textContent = source().resultNote;
  document.getElementById('searchBtn').textContent = '🔍 ' + source().label + 'の新着を検索する';

  currentFilter = 'all';
  hideChecked = hideCheckedBySource[name];
  updateHideBtn();

  if (resultCache[name]) {
    allItems = resultCache[name];
    await loadChecked();
    await loadWatch();
    document.getElementById('resultsCard').style.display = 'block';
    document.getElementById('progressLog').innerHTML = '';
    buildFilterBtns();
    renderTable(allItems);
    updateRefreshNote();
    // 前に取得してから時間がたっていれば、すぐ取り直す
    autoRefresh();
  } else {
    allItems = [];
    document.getElementById('resultsCard').style.display = 'none';
  }
}

const MODEL_NAMES = [
  'ゲームボーイ（DMG）',
  'ゲームボーイカラー', 'ゲームボーイポケット', 'ゲームボーイアドバンス',
  'ゲームボーイアドバンスSP', 'DS', 'DS Lite', 'DSi', 'DSi LL',
  '3DS', '3DS LL', 'PSP 1000', 'PSP 2000', 'PSP 3000',
];

function getAuctionId(link) {
  return source().idOf(link);
}

async function loadChecked() {
  try {
    var res = await fetch('/api/checked?source=' + currentSource);
    var data = await res.json();
    checkedIds = new Set(data.checked || []);
  } catch (e) {
    checkedIds = new Set();
  }
}

// 監視リストはメルカリのオークションだけが対象
async function loadWatch() {
  if (currentSource !== 'mercari') { watchMap = {}; return; }
  try {
    var res = await fetch('/api/watch');
    var data = await res.json();
    watchMap = data.watch || {};
  } catch (e) {
    watchMap = {};
  }
}

async function saveCheck(auctionId) {
  await fetch('/api/checked', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ auctionId: auctionId, source: currentSource }),
  });
}

async function removeCheck(auctionId) {
  await fetch('/api/checked', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ auctionId: auctionId, source: currentSource }),
  });
}

async function clearChecked() {
  await fetch('/api/checked', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source: currentSource }),
  });
  checkedIds.clear();
  renderTable(allItems);
}

function updateHideBtn() {
  var btn = document.getElementById('hideCheckedBtn');
  btn.classList.toggle('active', hideChecked);
  btn.textContent = hideChecked ? 'チェック済みを表示' : 'チェック済みを隠す';
}

function toggleHideChecked() {
  hideChecked = !hideChecked;
  hideCheckedBySource[currentSource] = hideChecked;
  updateHideBtn();
  renderTable(allItems);
}

function toMinutes(s) {
  if (!s) return 99999;
  if (s.includes('日')) return (parseInt(s) || 99999) * 1440;
  if (s.includes('時間')) return (parseInt(s) || 99999) * 60;
  if (s.includes('分')) return parseInt(s) || 99999;
  if (s.includes('秒')) return 1;
  return 99999;
}

// オークションの残り時間（終了間際の入札で延長されるので、あくまで予定）
function remainText(iso) {
  var min = Math.round((new Date(iso).getTime() - Date.now()) / 60000);
  if (min <= 0) return '終了間近';
  if (min < 60) return 'あと' + min + '分';
  var h = Math.floor(min / 60);
  if (h < 24) return 'あと' + h + '時間' + (min % 60 ? (min % 60) + '分' : '');
  return 'あと' + Math.floor(h / 24) + '日' + (h % 24 ? (h % 24) + '時間' : '');
}

function endText(iso) {
  var d = new Date(iso);
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
    ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}

function getBadge(status) {
  if (status === '中古') return '<span class="badge badge-used">中古</span>';
  if (status === 'ジャンク') return '<span class="badge badge-junk">ジャンク</span>';
  return '';
}

// オークションか定額かを一目で分かるようにする（ヤフオク・メルカリ共通）
function getTypeBadge(item) {
  return item.isAuction
    ? '<span class="badge badge-auction">オークション</span>'
    : '<span class="badge badge-fixed">定額</span>';
}

// 入札数と即決価格。取れていない項目は出さない
function bidNote(item) {
  var parts = [];
  var bids = item.totalBid != null ? item.totalBid : item.bidCount;
  if (bids != null) parts.push('入札 ' + bids + '件');
  if (item.buyNowPrice) parts.push('即決 ¥' + Number(item.buyNowPrice).toLocaleString());
  return parts.length ? '<div class="cond">' + parts.join(' / ') + '</div>' : '';
}

function getTaxBadge(isStore) {
  return isStore
    ? '<span class="tax-badge tax-in">税込</span>'
    : '<span class="tax-badge tax-ex">税抜</span>';
}

function calcTotal(price, postage) {
  var p = parseInt(price);
  if (isNaN(p)) return '-';
  if (postage.includes('無料') || postage.includes('込')) return '¥' + p.toLocaleString();
  var m = postage.match(/(\d[\d,]+)円/);
  if (m) return '¥' + (p + parseInt(m[1].replace(',', ''))).toLocaleString();
  return '-';
}

function buildFilterBtns() {
  var container = document.getElementById('filterBtns');
  var active = MODEL_NAMES.filter(function(m) { return allItems.some(function(i) { return i.model === m; }); });
  container.innerHTML = ['all'].concat(active).map(function(m) {
    return '<button class="filter-btn ' + (m === currentFilter ? 'active' : '') + '" onclick="setFilter(\'' + m + '\', this)">' +
      (m === 'all' ? 'すべて' : m) + '</button>';
  }).join('');
}

function renderTable(items) {
  var modelFiltered = currentFilter === 'all' ? items : items.filter(function(i) { return i.model === currentFilter; });
  var filtered = hideChecked ? modelFiltered.filter(function(i) { return !checkedIds.has(getAuctionId(i.link)); }) : modelFiltered;

  var hiddenCount = modelFiltered.length - filtered.length;
  var countText = filtered.length + ' 件表示 / 全' + items.length + '件';
  if (hiddenCount > 0) countText += ' （' + hiddenCount + '件非表示）';
  document.getElementById('resultCount').textContent = countText;

  if (filtered.length === 0) {
    document.getElementById('resultsBody').innerHTML = '<div class="status">該当する商品が見つかりませんでした</div>';
    return;
  }

  var isMercari = currentSource === 'mercari';
  renderedItems = filtered;

  var rows = '';
  for (var i = 0; i < filtered.length; i++) {
    var item = filtered[i];
    var auctionId = getAuctionId(item.link);
    var checked = checkedIds.has(auctionId);
    var encodedId = auctionId.replace(/'/g, "\\'");

    // オークションは price が「現在の最高入札額」なので、その旨を出す
    var priceCell = item.isAuction
      ? '現在 ¥' + Number(item.price).toLocaleString() + (isMercari ? '' : getTaxBadge(item.isStore)) + bidNote(item)
      : '¥' + Number(item.price).toLocaleString() + getTaxBadge(item.isStore);

    // ヤフオクは endAt（終了時刻）、メルカリのオークションは bidDeadline から残り時間をその場で計算する
    var deadline = item.endAt || (item.isAuction && item.bidDeadline);
    var timeCell = deadline
      ? remainText(deadline) + '<div class="cond">終了予定 ' + endText(deadline) + '</div>'
      : (item.endTime || '不明');

    rows += '<tr class="' + (checked ? 'checked' : '') + '" id="row' + i + '">' +
      '<td><button class="check-btn ' + (checked ? 'on' : '') + '" onclick="doCheck(\'' + encodedId + '\',' + i + ')">' + (checked ? '✓' : '') + '</button></td>' +
      '<td>' + item.model + '</td>' +
      '<td><a href="' + item.link + '" target="_blank">' + item.title + '</a></td>' +
      '<td>' + getBadge(item.status) + ' ' + getTypeBadge(item) +
        (item.condition ? '<div class="cond">' + item.condition + '</div>' : '') + '</td>' +
      '<td>' + priceCell + '</td>' +
      '<td>' + item.postage + '</td>' +
      '<td>' + calcTotal(item.price, item.postage) + '</td>' +
      '<td>' + timeCell + '</td>' +
      (isMercari ? '<td>' + watchCell(item, encodedId, i) + '</td>' : '') +
      '</tr>';
  }

  document.getElementById('resultsBody').innerHTML =
    '<table><thead><tr><th></th><th>機種</th><th>商品名</th><th>状態</th><th>価格</th><th>送料</th><th>合計</th><th>' + source().timeHeader + '</th>' +
    (isMercari ? '<th>終了通知</th>' : '') + '</tr></thead><tbody>' + rows + '</tbody></table>';

  updateWatchCount();
}

// 監視ボタン。オークション以外は登録しても意味がないので出さない
function watchCell(item, encodedId, i) {
  if (!item.isAuction) return '<span style="color:#ccc;">-</span>';
  var w = watchMap[getAuctionId(item.link)];
  return '<button class="watch-btn' + (w ? ' on' : '') + '" onclick="doWatch(\'' + encodedId + '\',' + i + ')">' +
    (w ? '通知ON ¥' + Number(w.maxPrice).toLocaleString() : '+ 通知') + '</button>';
}

function updateWatchCount() {
  var el = document.getElementById('watchCount');
  if (!el) return;
  var n = Object.keys(watchMap).length;
  el.innerHTML = currentSource === 'mercari' && n
    ? '<span class="watch-count">終了通知を登録中: ' + n + '件</span>'
    : '';
}

// 上限額を決めて登録するだけ。入札そのものは手動（メルカリは入札の取り消しができない）
async function doWatch(id, i) {
  var item = renderedItems[i];
  if (!item) return;

  if (watchMap[id]) {
    if (!confirm('この商品の終了通知を解除しますか？\n\n' + item.title)) return;
    await fetch('/api/watch', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id }),
    });
    delete watchMap[id];
    renderTable(allItems);
    return;
  }

  var suggested = item.priceLimit || '';
  var input = prompt(
    '入札の上限額（円）を入れてください。\n終了60分前・15分前・5分前に通知します（入札は手動です）。\n\n' +
    item.title + '\n現在 ¥' + Number(item.price).toLocaleString(),
    suggested);
  if (!input) return;

  var maxPrice = parseInt(String(input).replace(/[^0-9]/g, ''), 10);
  if (!maxPrice) { alert('金額を数字で入れてください'); return; }

  var res = await fetch('/api/watch', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: id, url: item.link, title: item.title, model: item.model, maxPrice: maxPrice }),
  });
  var data = await res.json();
  if (!res.ok) { alert('登録に失敗しました: ' + (data.error || '')); return; }

  watchMap[id] = data.entry;
  renderTable(allItems);
}

async function doCheck(auctionId, i) {
  var row = document.getElementById('row' + i);
  var btn = row.querySelector('.check-btn');
  if (checkedIds.has(auctionId)) {
    checkedIds.delete(auctionId);
    btn.classList.remove('on');
    btn.textContent = '';
    row.classList.remove('checked');
    await removeCheck(auctionId);
  } else {
    checkedIds.add(auctionId);
    btn.classList.add('on');
    btn.textContent = '✓';
    row.classList.add('checked');
    await saveCheck(auctionId);
    if (hideChecked) renderTable(allItems);
  }
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  renderTable(allItems);
}
// ── ほぼリアルタイム反映 ─────────────────────────────────────────────
// 一度検索したタブは、画面を開いている間 AUTO_REFRESH_MS ごとに自動で取り直す。
// その合間も TICK_MS ごとに残り時間を計算し直し、終了時刻を過ぎた行はその場で消す。
var AUTO_REFRESH_MS = 3 * 60 * 1000;
var TICK_MS = 30 * 1000;
var fetchedAt = { yahoo: 0, mercari: 0 };
var loading = false;

function sortItems(items) {
  return items.sort(function(a, b) {
    if (a.endAt && b.endAt) return a.endAt - b.endAt;
    return toMinutes(a.endTime) - toMinutes(b.endTime);
  });
}

// 終了時刻を過ぎた出品を落とす（ヤフオクは endAt。メルカリのオークションは延長があるので対象外）
function dropEnded(items) {
  var now = Date.now();
  return items.filter(function(i) { return !i.endAt || i.endAt > now; });
}

function updateRefreshNote(error) {
  var el = document.getElementById('refreshNote');
  var at = fetchedAt[currentSource];
  if (!at) { el.textContent = ''; return; }
  var d = new Date(at);
  el.textContent = '最終更新 ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) +
    '（' + (AUTO_REFRESH_MS / 60000) + '分ごとに自動更新）' + (error ? ' ※直近の自動更新に失敗しました' : '');
}

// 検索APIを叩いて一覧を差し替える。取得中にタブを切り替えられても、取得元のタブに結果を入れる
async function fetchItems() {
  var name = currentSource;
  var res = await fetch(SOURCES[name].endpoint + '?t=' + Date.now(), { cache: 'no-store' });
  var data = await res.json();
  if (!res.ok || !data.items) throw new Error(data.error || 'fetch failed');
  var items = sortItems(dropEnded(data.items));
  resultCache[name] = items;
  fetchedAt[name] = Date.now();
  if (name === currentSource) allItems = items;
}

async function startSearch() {
  // 自動更新の取得中に押された場合は、それが終わるのを待ってから取り直す
  while (loading) await new Promise(function(r) { setTimeout(r, 200); });
  loading = true;
  var btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.textContent = '⏳ ' + source().label + 'を検索中...';
  document.getElementById('resultsCard').style.display = 'block';
  document.getElementById('progressLog').innerHTML = '<div class="progress">' + source().loading + '</div>';
  document.getElementById('resultsBody').innerHTML = '';

  await loadChecked();
  await loadWatch();
  hideChecked = hideCheckedBySource[currentSource];
  updateHideBtn();

  try {
    await fetchItems();
    document.getElementById('progressLog').innerHTML = '';
    currentFilter = 'all';
    buildFilterBtns();
    renderTable(allItems);
    updateRefreshNote();
  } catch (e) {
    document.getElementById('progressLog').innerHTML = '<div class="status" style="color:#e0003c;">エラーが発生しました。もう一度お試しください。</div>';
  }

  loading = false;
  btn.disabled = false;
  btn.textContent = '🔍 ' + source().label + 'の新着を検索する';
}

// 自動更新。表を消さずに裏で取り直し、選択中の機種フィルタもそのまま保つ
async function autoRefresh() {
  if (loading || document.hidden || !fetchedAt[currentSource]) return;
  if (Date.now() - fetchedAt[currentSource] < AUTO_REFRESH_MS) return;
  loading = true;
  var name = currentSource;
  var failed = false;
  try {
    await fetchItems();
  } catch (e) {
    failed = true;
  }
  loading = false;
  if (name !== currentSource) return;
  if (!failed) {
    await loadChecked();
    if (currentFilter !== 'all' && !allItems.some(function(i) { return i.model === currentFilter; })) currentFilter = 'all';
    buildFilterBtns();
    renderTable(allItems);
  }
  updateRefreshNote(failed);
}

// 残り時間の刻み直しと、終了した行の除去
function tick() {
  if (document.hidden || !fetchedAt[currentSource] || loading) return;
  var live = dropEnded(allItems);
  if (live.length !== allItems.length) {
    allItems = live;
    resultCache[currentSource] = live;
    buildFilterBtns();
  }
  renderTable(allItems);
  autoRefresh();
}

setInterval(tick, TICK_MS);
// 別のタブやアプリから戻ってきたら、その場で最新にする
document.addEventListener('visibilitychange', function() { if (!document.hidden) tick(); });
</script>
</body>
